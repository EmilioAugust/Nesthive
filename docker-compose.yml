version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: nesthive-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-nesthive}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nesthive123}
      POSTGRES_DB: ${DB_NAME:-nesthive}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - nesthive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nesthive} -d ${DB_NAME:-nesthive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI
  backend:
    build: ./backend
    container_name: nesthive-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-nesthive}:${DB_PASSWORD:-nesthive123}@postgres:5432/${DB_NAME:-nesthive}
      - ENVIRONMENT=development
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nesthive-network
    restart: unless-stopped
    command: >
      sh -c "
        sleep 5 &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

  # React
  frontend:
    build: ./frontend
    container_name: nesthive-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - nesthive-network
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  nesthive-network:
    driver: bridge

volumes:
  postgres_data:
  backend_venv: